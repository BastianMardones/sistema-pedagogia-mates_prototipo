spring.application.name=sistema-pedagogia

# ============================================================
# BASE DE DATOS (MySQL)
# Por defecto conecta a localhost:3306 para desarrollo en IDE
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/pedagogia_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:pedagogia_user}
spring.datasource.password=${DB_PASSWORD:pedagogia_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway (migraciones automáticas de BD)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# SERVER
# ============================================================
server.port=8080
server.error.include-message=always

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET:clave-secreta-para-desarrollo-cambiar-en-produccion-2026}
jwt.expiration=86400000

# ============================================================
# CORS (permitir peticiones desde Next.js en desarrollo)
# ============================================================
cors.allowed-origins=http://localhost:3000,http://frontend:3000

# ============================================================
# LOGGING
# ============================================================
logging.level.cl.pedagogia=DEBUG
logging.level.org.springframework.security=WARN
